# File ini taruh di: .github/workflows/keep-alive.yml (di root repo rig-order)
# Fungsinya: memanggil endpoint /api/ping-db secara otomatis setiap 3 hari,
# supaya Supabase menganggap project masih aktif dan tidak auto-pause.

name: Keep Supabase Alive

on:
  schedule:
    # Jalan setiap 3 hari sekali jam 03:00 UTC (± jam 10:00 WITA)
    - cron: '0 3 */3 * *'
  workflow_dispatch: {}   # supaya bisa dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase via endpoint
        run: |
          curl -f -s -o /dev/null -w "Status: %{http_code}\n" https://rig-order.vercel.app/api/ping-db || exit 1
